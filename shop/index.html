<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko — Ramah Tamah Coffee &amp; Artisan</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#3B6BA0;
    --ink-soft:#2F5C8C;
    --ink-line: rgba(238,244,251,0.22);
    --paper:#EEF4FB;
    --paper-text:#16283F;
    --blue:#16283F;
    --blue-deep:#0F1C30;
    --amber:#16283F;
    --amber-hover:#0F1C30;
    --amber-soft: rgba(238,244,251,0.16);
    --text-strong:#EEF4FB;
    --cream-dim: rgba(238,244,251,0.78);
    --ok:#2E8B57;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--cream-dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  h1,h2,h3{
    font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    color:var(--text-strong);
    line-height:1.1;
    font-weight:600;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .mono{
    font-family:ui-monospace,'SF Mono','Cascadia Code','Courier New',monospace;
    letter-spacing:0.07em;
    text-transform:uppercase;
    font-size:0.7rem;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}

  /* HEADER */
  header{
    position:fixed; top:0; left:0; right:0; width:100%;
    z-index:40;
    background:transparent;
    border-bottom:none;
    transition:background 0.3s ease, border-color 0.3s ease;
  }
  header.scrolled{
    background:rgba(59,107,160,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--ink-line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 28px; width:100%;
  }
  .brandmark{display:flex; align-items:center; gap:12px; min-width:0; flex-shrink:1;}
  .logo-img{height:22px; width:auto; max-width:100%;}
  .nav-right{display:flex; align-items:center; gap:18px;}
  .cart-btn{
    position:relative;
    display:flex; align-items:center; gap:8px;
    background:var(--ink-soft); border:1px solid var(--ink-line);
    color:var(--text-strong); padding:10px 16px; border-radius:2px; font-size:0.85rem; font-weight:600;
  }
  .cart-btn:hover{border-color:var(--blue);}
  .cart-count{
    background:var(--amber); color:#FFFFFF;
    min-width:18px; height:18px; border-radius:50%;
    font-size:0.68rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* SHOP HERO (full screen, samakan dengan index) */
  .shop-hero{
    height:100vh;
    position:relative;
    overflow:hidden;
    border-bottom:none;
  }
  .shop-hero .hero-img{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center;
    display:block;
  }
  .shop-hero .hero-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(15,28,48,0.35) 0%, rgba(15,28,48,0.15) 40%, rgba(15,28,48,0.55) 100%);
  }

  /* FILTER PILLS */
  .filters{
    display:flex; gap:10px; flex-wrap:wrap;
    padding:26px 0; border-bottom:1px solid var(--ink-line);
  }
  .pill{
    padding:9px 18px; border-radius:999px;
    border:1px solid var(--ink-line);
    font-size:0.84rem; color:var(--cream-dim);
    background:transparent;
    transition:all 0.15s;
  }
  .pill.active{background:var(--blue); color:#FFFFFF; border-color:var(--blue); font-weight:600;}
  .pill:hover:not(.active){border-color:var(--blue);}

  /* PRODUCT GRID */
  .catalog{padding:40px 0 90px;}
  .grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:22px;
  }
  .card{
    background:var(--ink-soft); border:1px solid var(--ink-line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .card-swatch{
    height:150px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background:
      repeating-linear-gradient(135deg, rgba(238,244,251,0.06) 0px, rgba(238,244,251,0.06) 2px, transparent 2px, transparent 20px);
  }
  .card-swatch span{
    width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia, serif; font-weight:700; color:#FFFFFF; font-size:1.1rem;
  }
  .card-swatch img{width:100%; height:100%; object-fit:cover;}
  .grid-msg{
    grid-column:1/-1; text-align:center; padding:60px 10px; color:var(--cream-dim);
  }
  .grid-msg .mono{color:var(--blue); display:block; margin-bottom:10px;}
  .card-body{padding:20px 20px 22px; display:flex; flex-direction:column; gap:12px; flex-grow:1;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .card-top .mono{color:var(--amber);}
  .card h3{font-size:1.08rem;}
  .card p.desc{font-size:0.85rem; color:var(--cream-dim); flex-grow:1;}
  .variant-row{display:flex; gap:8px; flex-wrap:wrap;}
  .variant-pill{
    padding:6px 12px; border-radius:2px; border:1px solid var(--ink-line);
    font-size:0.76rem; color:var(--cream-dim); background:transparent;
  }
  .variant-pill.active{border-color:var(--blue); color:var(--blue-deep); background:rgba(59,107,160,0.12); font-weight:600;}
  .card-foot{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:6px; gap:10px;
  }
  .price{font-family:Georgia,serif; font-size:1.15rem; color:var(--text-strong);}
  .add-btn{
    background:var(--amber); color:#FFFFFF;
    padding:9px 16px; border:none; border-radius:2px;
    font-size:0.82rem; font-weight:700;
  }
  .add-btn:hover{background:var(--amber-hover);}
  .add-btn.added{background:var(--ok); color:#FFFFFF;}

  /* DRAWER (cart + checkout) */
  .overlay{
    position:fixed; inset:0; background:rgba(16,28,46,0.5);
    opacity:0; pointer-events:none; transition:opacity 0.25s;
    z-index:60;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0;
    width:420px; max-width:92vw;
    background:var(--ink-soft);
    border-left:1px solid var(--ink-line);
    transform:translateX(100%);
    transition:transform 0.3s ease;
    z-index:61;
    display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 24px; border-bottom:1px solid var(--ink-line);
  }
  .drawer-head h2{font-size:1.2rem;}
  .drawer-close{
    background:none; border:none; color:var(--cream-dim); font-size:1.3rem; line-height:1;
  }
  .drawer-close:hover{color:var(--text-strong);}
  .drawer-body{flex-grow:1; overflow-y:auto; padding:20px 24px;}
  .drawer-foot{padding:20px 24px; border-top:1px solid var(--ink-line);}

  .cart-item{
    display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--ink-line);
  }
  .cart-item-swatch{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; color:#FFFFFF; font-size:0.85rem;
  }
  .cart-item-info{flex-grow:1; display:flex; flex-direction:column; gap:4px;}
  .cart-item-info h4{font-family:Georgia,serif; color:var(--text-strong); font-size:0.95rem; font-weight:600;}
  .cart-item-info .mono{color:var(--cream-dim); font-size:0.65rem;}
  .cart-item-actions{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .stepper{display:flex; align-items:center; gap:10px; border:1px solid var(--ink-line); border-radius:2px;}
  .stepper button{background:none; border:none; color:var(--text-strong); width:26px; height:26px; font-size:0.95rem;}
  .stepper span{font-size:0.85rem; min-width:16px; text-align:center; color:var(--text-strong);}
  .remove-btn{background:none; border:none; color:rgba(238,244,251,0.5); font-size:0.75rem; text-decoration:underline;}
  .remove-btn:hover{color:var(--text-strong);}
  .line-total{font-family:Georgia,serif; color:var(--text-strong); font-size:0.9rem; white-space:nowrap;}

  .empty-state{text-align:center; padding:60px 10px; color:var(--cream-dim);}
  .empty-state .mono{color:var(--blue); margin-bottom:10px; display:block;}

  .subtotal-row{display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:6px; color:var(--cream-dim);}
  .total-row{display:flex; justify-content:space-between; font-size:1.15rem; margin:14px 0 18px; color:var(--text-strong); font-family:Georgia,serif;}
  .drawer-btn{
    width:100%; padding:13px; border:none; border-radius:2px;
    background:var(--amber); color:#FFFFFF; font-weight:700; font-size:0.92rem;
  }
  .drawer-btn:hover{background:var(--amber-hover);}
  .drawer-btn.secondary{background:none; border:1px solid var(--ink-line); color:var(--text-strong); margin-top:10px;}
  .drawer-btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* CHECKOUT FORM */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.8rem; color:var(--cream-dim); margin-bottom:7px;}
  .field input, .field textarea{
    width:100%; background:var(--ink); border:1px solid var(--ink-line);
    color:var(--text-strong); padding:10px 12px; border-radius:2px; font-size:0.88rem; font-family:inherit;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--blue);}
  .radio-group{display:flex; flex-direction:column; gap:10px;}
  .radio-opt{
    display:flex; gap:10px; align-items:flex-start;
    border:1px solid var(--ink-line); padding:12px; border-radius:2px; font-size:0.85rem;
  }
  .radio-opt input{margin-top:3px;}
  .radio-opt strong{color:var(--text-strong); display:block; margin-bottom:2px; font-size:0.86rem;}
  .radio-opt small{color:var(--cream-dim); font-size:0.76rem;}
  .order-recap{
    background:var(--ink-soft); border:1px solid var(--ink-line); padding:14px; margin-bottom:18px; font-size:0.82rem;
  }
  .order-recap div{display:flex; justify-content:space-between; padding:4px 0; color:var(--cream-dim);}
  .back-link{font-size:0.8rem; color:var(--blue); margin-bottom:16px; display:inline-block;}

  .success-box{text-align:center; padding:30px 10px;}
  .success-box .mono{color:var(--ok); display:block; margin-bottom:14px;}
  .success-box h3{font-size:1.3rem; margin-bottom:10px;}
  .success-box p{font-size:0.88rem; margin-bottom:22px;}

  footer{padding:40px 0; border-top:1px solid var(--ink-line); text-align:center;}
  footer .mono{color:rgba(239,232,216,0.35);}

  .pagination{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:44px;
  }
  .page-btn{
    min-width:36px; height:36px; padding:0 10px;
    border:1px solid var(--ink-line); background:transparent;
    color:var(--cream-dim); border-radius:2px; font-size:0.85rem;
  }
  .page-btn:hover:not(:disabled){border-color:var(--blue); color:var(--text-strong);}
  .page-btn.active{background:var(--blue); color:#FFFFFF; border-color:var(--blue); font-weight:700;}
  .page-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .page-dots{color:rgba(239,232,216,0.4); font-size:0.85rem; padding:0 4px;}

  @media(max-width:900px){
    .grid{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:600px){
    .grid{grid-template-columns:1fr;}
    .drawer{width:100%;}
    .logo-img{height:18px;}
    .nav{padding:8px 16px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="/" class="brandmark">
      <img src="/images/logo.png" alt="Ramah Tamah" class="logo-img">
    </a>
    <div class="nav-right">
      <button class="cart-btn" id="openCart">
        Keranjang <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<section class="shop-hero">
  <img src="/images/hero.png" alt="Ramah Tamah" class="hero-img">
  <div class="hero-overlay"></div>
</section>

<div class="wrap">
  <div class="filters" id="filters">
    <button class="pill active" data-filter="Semua">Semua Produk</button>
    <button class="pill" data-filter="Roastbeans">Roastbeans</button>
    <button class="pill" data-filter="Artisan Tea">Artisan Tea</button>
    <button class="pill" data-filter="Condiment">Condiment</button>
  </div>
</div>

<section class="catalog">
  <div class="wrap">
    <div class="grid" id="productGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</section>

<footer>
  <div class="wrap mono">© 2026 Ramah Tamah Coffee &amp; Artisan — Toko Online</div>
</footer>

<!-- CART / CHECKOUT DRAWER -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">Keranjang</h2>
    <button class="drawer-close" id="closeDrawer">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<script>
(function(){
  "use strict";

  // ====== ISI CONFIG FIREBASE KAMU DI SINI (dari Firebase Console) ======
  var firebaseConfig = {
    apiKey: "AIzaSyDaoGRPEl6Gm34CbkP0-CMM3el-beul0zc",
    authDomain: "ramah-tamah.firebaseapp.com",
    projectId: "ramah-tamah",
    storageBucket: "ramah-tamah.firebasestorage.app",
    messagingSenderId: "693281781727",
    appId: "1:693281781727:web:d49fab3036378fbb76766a"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  var PRODUCTS = [];
  // ====== EDIT NOMOR REKENING / WA DI SINI ======
  var STORE_WHATSAPP = '6280000000000';
  var BANK_INFO = 'BCA 1234567890 a.n. Ramah Tamah Coffee';

  var selectedVariant = {};
  var cart = []; // {productId, variantLabel, price, qty}
  var currentFilter = 'Semua';
  var currentPage = 1;
  var PAGE_SIZE = 6;
  var productsLoading = true;
  var view = 'cart'; // 'cart' | 'checkout' | 'success'
  var lastOrderId = '';

  function rupiah(n){
    return 'Rp' + n.toLocaleString('id-ID');
  }

  function initials(name){
    return name.split(' ').slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
  }

  function swatchColor(category){
    if(category === 'Roastbeans') return '#3B6BA0';
    if(category === 'Artisan Tea') return '#5B8FC7';
    return '#1B3D66';
  }

  function renderGrid(){
    var grid = document.getElementById('productGrid');

    if(productsLoading){
      grid.innerHTML = '<div class="grid-msg"><span class="mono">Memuat</span>Lagi ambil produk terbaru...</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    if(PRODUCTS.length === 0){
      grid.innerHTML = '<div class="grid-msg"><span class="mono">Kosong</span>Belum ada produk. Tambahin dulu lewat halaman admin.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    var allItems = PRODUCTS.filter(function(p){
      return currentFilter === 'Semua' || p.category === currentFilter;
    });
    var totalPages = Math.max(1, Math.ceil(allItems.length / PAGE_SIZE));
    if(currentPage > totalPages) currentPage = totalPages;
    if(currentPage < 1) currentPage = 1;
    var start = (currentPage - 1) * PAGE_SIZE;
    var items = allItems.slice(start, start + PAGE_SIZE);

    if(items.length === 0){
      grid.innerHTML = '<div class="grid-msg"><span class="mono">Kosong</span>Belum ada produk di kategori ini.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    grid.innerHTML = items.map(function(p){
      if(selectedVariant[p.id] === undefined) selectedVariant[p.id] = 0;
      var vIdx = selectedVariant[p.id];
      var variant = p.variants[vIdx];
      var pillsHtml = p.variants.map(function(v, i){
        return '<button class="variant-pill' + (i === vIdx ? ' active' : '') + '" data-pid="' + p.id + '" data-vidx="' + i + '">' + v.label + '</button>';
      }).join('');
      return (
        '<div class="card">' +
          '<div class="card-swatch">' + (p.imageUrl ? '<img src="' + p.imageUrl + '" alt="' + p.name + '">' : '<span style="background:' + swatchColor(p.category) + '">' + initials(p.name) + '</span>') + '</div>' +
          '<div class="card-body">' +
            '<div class="card-top"><span class="mono">' + p.category + '</span></div>' +
            '<h3>' + p.name + '</h3>' +
            '<p class="desc">' + p.desc + '</p>' +
            '<div class="variant-row">' + pillsHtml + '</div>' +
            '<div class="card-foot">' +
              '<span class="price">' + rupiah(variant.price) + '</span>' +
              '<button class="add-btn" data-pid="' + p.id + '">+ Keranjang</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    renderPagination(totalPages);
  }

  function renderPagination(totalPages){
    var el = document.getElementById('pagination');
    if(totalPages <= 1){
      el.innerHTML = '';
      return;
    }
    var html = '';
    html += '<button class="page-btn" data-page="prev"' + (currentPage === 1 ? ' disabled' : '') + '>&larr;</button>';
    for(var i = 1; i <= totalPages; i++){
      if(i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1){
        html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
      } else if(i === currentPage - 2 || i === currentPage + 2){
        html += '<span class="page-dots">&hellip;</span>';
      }
    }
    html += '<button class="page-btn" data-page="next"' + (currentPage === totalPages ? ' disabled' : '') + '>&rarr;</button>';
    el.innerHTML = html;
  }

  document.getElementById('pagination').addEventListener('click', function(e){
    var btn = e.target.closest('.page-btn');
    if(!btn || btn.disabled) return;
    var val = btn.dataset.page;
    if(val === 'prev') currentPage -= 1;
    else if(val === 'next') currentPage += 1;
    else currentPage = parseInt(val, 10);
    renderGrid();
    document.querySelector('.catalog').scrollIntoView({ behavior:'smooth', block:'start' });
  });

  document.getElementById('filters').addEventListener('click', function(e){
    var btn = e.target.closest('.pill');
    if(!btn) return;
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    currentPage = 1;
    renderGrid();
  });

  document.getElementById('productGrid').addEventListener('click', function(e){
    var vBtn = e.target.closest('.variant-pill');
    if(vBtn){
      selectedVariant[vBtn.dataset.pid] = parseInt(vBtn.dataset.vidx, 10);
      renderGrid();
      return;
    }
    var aBtn = e.target.closest('.add-btn');
    if(aBtn){
      addToCart(aBtn.dataset.pid);
      aBtn.textContent = 'Ditambahkan';
      aBtn.classList.add('added');
      setTimeout(function(){
        aBtn.textContent = '+ Keranjang';
        aBtn.classList.remove('added');
      }, 900);
    }
  });

  function addToCart(pid){
    var p = PRODUCTS.find(function(x){ return x.id === pid; });
    var vIdx = selectedVariant[pid] || 0;
    var variant = p.variants[vIdx];
    var existing = cart.find(function(c){ return c.productId === pid && c.variantLabel === variant.label; });
    if(existing){
      existing.qty += 1;
    } else {
      cart.push({ productId: pid, name: p.name, category: p.category, variantLabel: variant.label, price: variant.price, qty: 1 });
    }
    updateCartCount();
  }

  function updateCartCount(){
    var count = cart.reduce(function(sum, c){ return sum + c.qty; }, 0);
    document.getElementById('cartCount').textContent = count;
  }

  function cartTotal(){
    return cart.reduce(function(sum, c){ return sum + c.price * c.qty; }, 0);
  }

  function openDrawer(startView){
    view = startView || 'cart';
    document.getElementById('overlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');
    renderDrawer();
  }
  function closeDrawer(){
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
  }
  document.getElementById('openCart').addEventListener('click', function(){ openDrawer('cart'); });
  document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
  document.getElementById('overlay').addEventListener('click', closeDrawer);

  function renderDrawer(){
    var title = document.getElementById('drawerTitle');
    var body = document.getElementById('drawerBody');
    var foot = document.getElementById('drawerFoot');

    if(view === 'cart'){
      title.textContent = 'Keranjang';
      if(cart.length === 0){
        body.innerHTML = '<div class="empty-state"><span class="mono">Kosong</span>Keranjang kamu masih kosong. Yuk pilih produk dulu.</div>';
        foot.innerHTML = '';
        return;
      }
      body.innerHTML = cart.map(function(c, idx){
        return (
          '<div class="cart-item">' +
            '<div class="cart-item-swatch" style="background:' + swatchColor(c.category) + '">' + initials(c.name) + '</div>' +
            '<div class="cart-item-info">' +
              '<h4>' + c.name + '</h4>' +
              '<span class="mono">' + c.variantLabel + '</span>' +
              '<div class="cart-item-actions">' +
                '<div class="stepper">' +
                  '<button data-act="dec" data-idx="' + idx + '">−</button>' +
                  '<span>' + c.qty + '</span>' +
                  '<button data-act="inc" data-idx="' + idx + '">+</button>' +
                '</div>' +
                '<span class="line-total">' + rupiah(c.price * c.qty) + '</span>' +
              '</div>' +
              '<button class="remove-btn" data-act="remove" data-idx="' + idx + '">Hapus</button>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      foot.innerHTML =
        '<div class="subtotal-row"><span>Subtotal</span><span>' + rupiah(cartTotal()) + '</span></div>' +
        '<div class="total-row"><span>Total</span><span>' + rupiah(cartTotal()) + '</span></div>' +
        '<button class="drawer-btn" id="toCheckout">Lanjut ke Checkout</button>';

      var toCheckout = document.getElementById('toCheckout');
      if(toCheckout){
        toCheckout.addEventListener('click', function(){ openDrawer('checkout'); });
      }
      return;
    }

    if(view === 'checkout'){
      title.textContent = 'Checkout';
      var recap = cart.map(function(c){
        return '<div><span>' + c.name + ' (' + c.variantLabel + ') x' + c.qty + '</span><span>' + rupiah(c.price * c.qty) + '</span></div>';
      }).join('');

      body.innerHTML =
        '<a href="#" class="back-link" id="backToCart">&larr; Kembali ke keranjang</a>' +
        '<div class="order-recap">' + recap + '</div>' +
        '<form id="checkoutForm">' +
          '<div class="field"><label>Nama Penerima</label><input type="text" id="custName" required></div>' +
          '<div class="field"><label>No. WhatsApp</label><input type="tel" id="custPhone" required placeholder="08xxxxxxxxxx"></div>' +
          '<div class="field">' +
            '<label>Metode Pengambilan</label>' +
            '<div class="radio-group">' +
              '<label class="radio-opt"><input type="radio" name="fulfill" value="pickup" checked><span><strong>Ambil di Toko</strong><small>Kedai Ramah Tamah, Mojokerto</small></span></label>' +
              '<label class="radio-opt"><input type="radio" name="fulfill" value="delivery"><span><strong>Dikirim</strong><small>Ongkir dihitung & dikonfirmasi via WhatsApp</small></span></label>' +
            '</div>' +
          '</div>' +
          '<div class="field" id="addressField" style="display:none;"><label>Alamat Pengiriman</label><textarea id="custAddress" rows="3"></textarea></div>' +
          '<div class="field">' +
            '<label>Metode Pembayaran</label>' +
            '<div class="radio-group">' +
              '<label class="radio-opt"><input type="radio" name="payment" value="transfer" checked><span><strong>Transfer Bank</strong><small>' + BANK_INFO + '</small></span></label>' +
              '<label class="radio-opt"><input type="radio" name="payment" value="qris"><span><strong>QRIS</strong><small>Kode QRIS dikirim / ditunjukkan saat konfirmasi</small></span></label>' +
            '</div>' +
          '</div>' +
          '<div class="field"><label>Catatan (opsional)</label><textarea id="custNote" rows="2"></textarea></div>' +
        '</form>';

      foot.innerHTML =
        '<div class="total-row"><span>Total Bayar</span><span>' + rupiah(cartTotal()) + '</span></div>' +
        '<button class="drawer-btn" id="submitOrder">Konfirmasi via WhatsApp</button>';

      document.getElementById('backToCart').addEventListener('click', function(e){
        e.preventDefault();
        openDrawer('cart');
      });
      document.querySelectorAll('input[name="fulfill"]').forEach(function(r){
        r.addEventListener('change', function(){
          document.getElementById('addressField').style.display = (this.value === 'delivery') ? 'block' : 'none';
        });
      });
      document.getElementById('submitOrder').addEventListener('click', function(){
        var name = document.getElementById('custName').value.trim();
        var phone = document.getElementById('custPhone').value.trim();
        if(!name || !phone){
          alert('Isi dulu nama dan nomor WhatsApp ya.');
          return;
        }
        var fulfill = document.querySelector('input[name="fulfill"]:checked').value;
        var payment = document.querySelector('input[name="payment"]:checked').value;
        var address = document.getElementById('custAddress') ? document.getElementById('custAddress').value.trim() : '';
        var note = document.getElementById('custNote').value.trim();

        lastOrderId = 'RTM-' + Date.now().toString().slice(-6);

        var lines = [];
        lines.push('Halo Ramah Tamah, saya mau order (' + lastOrderId + '):');
        cart.forEach(function(c){
          lines.push('- ' + c.name + ' (' + c.variantLabel + ') x' + c.qty + ' = ' + rupiah(c.price * c.qty));
        });
        lines.push('Total: ' + rupiah(cartTotal()));
        lines.push('Nama: ' + name);
        lines.push('No HP: ' + phone);
        lines.push('Pengambilan: ' + (fulfill === 'pickup' ? 'Ambil di toko' : 'Dikirim — ' + address));
        lines.push('Pembayaran: ' + (payment === 'transfer' ? 'Transfer Bank (' + BANK_INFO + ')' : 'QRIS'));
        if(note) lines.push('Catatan: ' + note);

        var waText = encodeURIComponent(lines.join('\n'));
        window.open('https://wa.me/' + STORE_WHATSAPP + '?text=' + waText, '_blank');

        cart = [];
        updateCartCount();
        openDrawer('success');
      });
      return;
    }

    if(view === 'success'){
      title.textContent = 'Pesanan Terkirim';
      body.innerHTML =
        '<div class="success-box">' +
          '<span class="mono">Order ' + lastOrderId + '</span>' +
          '<h3>Terima kasih!</h3>' +
          '<p>Detail pesanan kamu sudah kami siapkan di WhatsApp. Selesaikan pembayaran sesuai metode yang dipilih, lalu kirim bukti transfer di chat WhatsApp ya.</p>' +
        '</div>';
      foot.innerHTML = '<button class="drawer-btn secondary" id="continueShopping">Lanjut Belanja</button>';
      document.getElementById('continueShopping').addEventListener('click', closeDrawer);
    }
  }

  document.getElementById('drawerBody').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if(!btn) return;
    var idx = parseInt(btn.dataset.idx, 10);
    var act = btn.dataset.act;
    if(act === 'inc') cart[idx].qty += 1;
    if(act === 'dec'){ cart[idx].qty -= 1; if(cart[idx].qty <= 0) cart.splice(idx,1); }
    if(act === 'remove') cart.splice(idx,1);
    updateCartCount();
    renderDrawer();
  });

  db.collection('products').orderBy('createdAt', 'desc').onSnapshot(function(snapshot){
    PRODUCTS = snapshot.docs.map(function(doc){
      var data = doc.data();
      data.id = doc.id;
      return data;
    });
    productsLoading = false;
    currentPage = 1;
    renderGrid();
  }, function(err){
    console.error('Gagal ambil produk dari Firestore:', err);
    productsLoading = false;
    renderGrid();
  });

  renderGrid();

  var headerEl = document.querySelector('header');
  var heroEl = document.querySelector('.shop-hero');
  function toggleHeader(){
    if(!heroEl) return;
    var heroBottom = heroEl.getBoundingClientRect().bottom;
    if(heroBottom <= 80){
      headerEl.classList.add('scrolled');
    } else {
      headerEl.classList.remove('scrolled');
    }
  }
  toggleHeader();
  window.addEventListener('scroll', toggleHeader);
})();
</script>

</body>
</html>
