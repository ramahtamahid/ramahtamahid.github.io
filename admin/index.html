<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Produk — Ramah Tamah</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<style>
  :root{
    --ink:#3B6BA0;
    --ink-soft:#2F5C8C;
    --ink-line: rgba(238,244,251,0.22);
    --blue:#16283F;
    --blue-deep:#0F1C30;
    --text-strong:#EEF4FB;
    --cream-dim: rgba(238,244,251,0.78);
    --danger:#B3462C;
    --ok:#2E8B57;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--cream-dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:16px;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    color:var(--text-strong);
    line-height:1.15;
    font-weight:600;
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  .mono{
    font-family:ui-monospace,'SF Mono','Cascadia Code','Courier New',monospace;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:0.7rem;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 24px;}

  .app-shell{display:flex; min-height:100vh;}

  .sidebar{
    width:230px; flex-shrink:0;
    background:var(--blue-deep);
    border-right:1px solid var(--ink-line);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding:22px 20px;
    border-bottom:1px solid var(--ink-line);
  }
  .logo-img{height:24px; width:auto;}
  .sidebar-brand strong{color:var(--text-strong); font-family:Georgia,serif; font-size:1.05rem;}

  .sidebar-nav{flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    background:transparent; border:none; text-align:left;
    color:var(--cream-dim); font-size:0.92rem;
    padding:11px 12px; border-radius:3px;
  }
  .nav-item:hover{background:rgba(238,244,251,0.06); color:var(--text-strong);}
  .nav-item.active{background:var(--ink-soft); color:var(--text-strong); font-weight:600;}
  .nav-dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.6; flex-shrink:0;}
  .nav-item.active .nav-dot{opacity:1;}

  .sidebar-footer{
    padding:16px 20px 22px;
    border-top:1px solid var(--ink-line);
    display:flex; flex-direction:column; gap:10px;
  }
  .shop-link{
    font-size:0.85rem; color:var(--cream-dim);
    border:1px solid var(--ink-line); padding:8px 14px; border-radius:2px;
    display:inline-block;
  }
  .shop-link:hover{color:var(--text-strong); border-color:var(--text-strong);}

  main{flex:1; min-width:0; padding:40px 0 80px;}
  .content-wrap{max-width:760px; margin:0 auto; padding:0 32px;}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .panel{
    background:var(--ink-soft);
    border:1px solid var(--ink-line);
    border-radius:4px;
    padding:24px;
    margin-bottom:28px;
  }
  .panel h2{font-size:1.15rem; margin-bottom:18px;}

  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--cream-dim); margin-bottom:6px;
  }
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px;
    background:rgba(238,244,251,0.06);
    border:1px solid var(--ink-line);
    border-radius:2px;
    color:var(--text-strong);
    font-family:inherit; font-size:0.95rem;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  .checkbox-group{display:flex; flex-wrap:wrap; gap:10px;}
  .checkbox-pill{
    display:flex; align-items:center; gap:8px;
    padding:9px 14px; border:1px solid var(--ink-line); border-radius:20px;
    font-size:0.88rem; color:var(--cream-dim); cursor:pointer;
    background:rgba(238,244,251,0.04);
  }
  .checkbox-pill input{width:auto; margin:0;}
  .checkbox-pill:has(input:checked){
    background:var(--text-strong); color:var(--blue-deep); border-color:var(--text-strong); font-weight:600;
  }
  .variant-check-list{display:flex; flex-direction:column; gap:10px;}
  .variant-check-row{display:flex; align-items:center; gap:14px;}
  .variant-check-row .checkbox-pill{width:110px; flex-shrink:0; justify-content:center;}
  .variant-check-row .var-price{flex:1; padding:9px 12px;}
  .variant-check-row .var-price:disabled{opacity:0.4;}

  .variant-row{
    display:grid; grid-template-columns:1fr 140px 40px; gap:10px; margin-bottom:10px; align-items:center;
  }
  .variant-row input{padding:8px 10px;}
  .icon-btn{
    background:transparent; border:1px solid var(--ink-line); color:var(--cream-dim);
    border-radius:2px; width:36px; height:36px; font-size:1.1rem;
  }
  .icon-btn:hover{border-color:var(--danger); color:var(--danger);}
  .add-variant-btn{
    background:transparent; border:1px dashed var(--ink-line); color:var(--cream-dim);
    padding:8px 14px; border-radius:2px; font-size:0.85rem; margin-bottom:16px;
  }
  .add-variant-btn:hover{border-color:var(--text-strong); color:var(--text-strong);}

  .actions{display:flex; gap:12px; margin-top:8px;}
  .btn{
    padding:10px 20px; border-radius:2px; border:none; font-weight:600; font-size:0.9rem;
  }
  .btn-primary{background:var(--text-strong); color:var(--blue-deep);}
  .btn-primary:hover{opacity:0.9;}
  .btn-ghost{background:transparent; border:1px solid var(--ink-line); color:var(--cream-dim);}
  .btn-ghost:hover{color:var(--text-strong); border-color:var(--text-strong);}

  .status{font-size:0.85rem; margin-top:10px;}
  .status.ok{color:#B8E0C8;}
  .status.err{color:#F0B8A8;}

  .list-item{
    display:flex; gap:16px; align-items:flex-start;
    padding:16px 0; border-bottom:1px solid var(--ink-line);
  }
  .list-item:last-child{border-bottom:none;}
  .list-thumb{
    width:64px; height:64px; border-radius:2px; background:rgba(238,244,251,0.08);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family:Georgia,serif; font-weight:700; color:var(--text-strong);
  }
  .list-thumb img{width:100%; height:100%; object-fit:cover;}
  .list-info{flex:1; min-width:0;}
  .list-info h3{font-size:1rem; margin-bottom:2px;}
  .list-info .cat{color:var(--cream-dim);}
  .list-info .variants{font-size:0.85rem; margin-top:6px; color:var(--cream-dim);}
  .list-btns{display:flex; gap:8px; flex-shrink:0;}
  .small-btn{
    padding:7px 12px; font-size:0.8rem; border-radius:2px; border:1px solid var(--ink-line);
    background:transparent; color:var(--cream-dim);
  }
  .small-btn:hover{color:var(--text-strong); border-color:var(--text-strong);}
  .small-btn.danger:hover{color:var(--danger); border-color:var(--danger);}

  .empty-msg{color:var(--cream-dim); font-size:0.9rem; padding:20px 0; text-align:center;}

  @media(max-width:760px){
    .app-shell{flex-direction:column;}
    .sidebar{
      width:100%; height:auto; position:sticky; top:0; z-index:10;
      flex-direction:row; align-items:center;
      overflow-x:auto;
    }
    .sidebar-brand{border-bottom:none; border-right:1px solid var(--ink-line); flex-shrink:0;}
    .sidebar-nav{flex-direction:row; padding:10px;}
    .nav-item{white-space:nowrap;}
    .sidebar-footer{border-top:none; flex-direction:row; padding:10px 16px;}
    .content-wrap{padding:0 20px;}
    .row2{grid-template-columns:1fr;}
  }

  .order-item{padding:16px 0; border-bottom:1px solid var(--ink-line);}
  .order-item:last-child{border-bottom:none;}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px;}
  .order-code{font-family:Georgia,serif; font-weight:700; color:var(--text-strong); font-size:1rem;}
  .order-cust{font-size:0.85rem; color:var(--cream-dim);}
  .badge{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em;
    padding:4px 10px; border-radius:2px; white-space:nowrap;
  }
  .badge-baru{background:rgba(240,184,0,0.18); color:#F0B800;}
  .badge-diproses{background:rgba(91,143,199,0.2); color:#9CC4EE;}
  .badge-selesai{background:rgba(46,139,87,0.2); color:#8FD8AE;}
  .order-items{font-size:0.85rem; margin:6px 0; color:var(--cream-dim);}
  .order-items div{margin-bottom:2px;}
  .order-total{font-weight:700; color:var(--text-strong); margin-top:4px;}
  .order-meta{font-size:0.78rem; color:var(--cream-dim); margin-top:6px;}
  .order-actions{display:flex; gap:8px; margin-top:10px;}
  select.status-select{
    padding:6px 10px; font-size:0.8rem; background:rgba(238,244,251,0.06);
    border:1px solid var(--ink-line); color:var(--text-strong); border-radius:2px;
  }

  /* LOGIN GATE */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .login-box{
    width:100%; max-width:360px;
    background:var(--ink-soft);
    border:1px solid var(--ink-line);
    border-radius:4px;
    padding:32px;
  }
  .login-box h2{font-size:1.2rem; margin-bottom:20px; text-align:center;}
  #adminApp{display:none;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>Masuk Admin</h2>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Masuk</button>
      <div class="status err" id="loginStatus"></div>
    </form>
  </div>
</div>

<div id="adminApp">
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/images/logo.png" alt="Ramah Tamah" class="logo-img">
      <strong>Admin</strong>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" data-tab="pesanan">
        <span class="nav-dot"></span> Pesanan Online
      </button>
      <button class="nav-item active" data-tab="produk">
        <span class="nav-dot"></span> Produk
      </button>
    </nav>
    <div class="sidebar-footer">
      <a href="/shop/" class="shop-link">Lihat Shop &rarr;</a>
      <button class="shop-link" id="logoutBtn" style="border:none; background:transparent; text-align:left;">Keluar</button>
    </div>
  </aside>

  <main>
    <div class="content-wrap">

      <section class="tab-panel" data-panel="pesanan">
        <div class="panel">
          <h2>Pesanan Online</h2>
          <div id="orderList"><div class="empty-msg">Memuat pesanan...</div></div>
        </div>
      </section>

      <section class="tab-panel active" data-panel="produk">
        <div class="panel">
          <h2 id="formTitle">Tambah Produk Baru</h2>
          <form id="productForm">
            <div class="field">
              <label>Nama Produk</label>
              <input type="text" id="fName" required placeholder="mis. Roastbeans SO Manglayang Red Honey">
            </div>
            <div class="field">
              <label>Kategori</label>
              <div class="checkbox-group" id="categoryGroup">
                <label class="checkbox-pill"><input type="checkbox" class="cat-check" value="Roastbeans"> Roastbeans</label>
                <label class="checkbox-pill"><input type="checkbox" class="cat-check" value="Artisan Tea"> Artisan Tea</label>
                <label class="checkbox-pill"><input type="checkbox" class="cat-check" value="Condiment"> Condiment</label>
              </div>
            </div>
            <div class="field">
              <label>Gambar Produk</label>
              <input type="file" id="fImageFile" accept="image/*">
              <input type="hidden" id="fImage">
              <div id="imagePreviewWrap" style="margin-top:10px; display:none;">
                <img id="imagePreview" style="width:80px; height:80px; object-fit:cover; border-radius:2px; border:1px solid var(--ink-line);">
              </div>
              <div id="uploadStatus" style="font-size:0.8rem; margin-top:6px; color:var(--cream-dim);"></div>
            </div>
            <div class="field">
              <label>Deskripsi Singkat</label>
              <textarea id="fDesc" placeholder="Deskripsi produk yang tampil di kartu shop"></textarea>
            </div>

            <div class="field">
              <label>Varian &amp; Harga</label>
              <div class="variant-check-list" id="variantCheckList">
                <div class="variant-check-row">
                  <label class="checkbox-pill"><input type="checkbox" class="var-check" value="50gr"> 50gr</label>
                  <input type="number" class="var-price" placeholder="Harga" disabled>
                </div>
                <div class="variant-check-row">
                  <label class="checkbox-pill"><input type="checkbox" class="var-check" value="100gr"> 100gr</label>
                  <input type="number" class="var-price" placeholder="Harga" disabled>
                </div>
                <div class="variant-check-row">
                  <label class="checkbox-pill"><input type="checkbox" class="var-check" value="150gr"> 150gr</label>
                  <input type="number" class="var-price" placeholder="Harga" disabled>
                </div>
                <div class="variant-check-row">
                  <label class="checkbox-pill"><input type="checkbox" class="var-check" value="200gr"> 200gr</label>
                  <input type="number" class="var-price" placeholder="Harga" disabled>
                </div>
              </div>
            </div>

            <div class="actions">
              <button type="submit" class="btn btn-primary" id="submitBtn">Simpan Produk</button>
              <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Batal Edit</button>
            </div>
            <div class="status" id="formStatus"></div>
          </form>
        </div>

        <div class="panel">
          <h2>Produk Aktif</h2>
          <div id="productList"><div class="empty-msg">Memuat produk...</div></div>
        </div>
      </section>

    </div>
  </main>

</div>

</div>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDaoGRPEl6Gm34CbkP0-CMM3el-beul0zc",
    authDomain: "ramah-tamah.firebaseapp.com",
    projectId: "ramah-tamah",
    storageBucket: "ramah-tamah.firebasestorage.app",
    messagingSenderId: "693281781727",
    appId: "1:693281781727:web:d49fab3036378fbb76766a"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var WORKER_URL = 'https://ramahtamah-api.rmtm-artisan.workers.dev';

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function convertToWebp(file, maxDimension, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var objectUrl = URL.createObjectURL(file);
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        if(w > maxDimension || h > maxDimension){
          if(w >= h){ h = Math.round(h * (maxDimension / w)); w = maxDimension; }
          else { w = Math.round(w * (maxDimension / h)); h = maxDimension; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob){
          URL.revokeObjectURL(objectUrl);
          if(!blob){ reject(new Error('Gagal konversi gambar ke WebP.')); return; }
          resolve(blob);
        }, 'image/webp', quality);
      };
      img.onerror = function(){ URL.revokeObjectURL(objectUrl); reject(new Error('Gagal memuat gambar.')); };
      img.src = objectUrl;
    });
  }

  function uploadImageToR2(file){
    return convertToWebp(file, 1600, 0.82).then(function(webpBlob){
      var baseName = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9.\-_]/g, '_');
      var filename = baseName + '.webp';
      return fileToBase64(webpBlob).then(function(base64){
        return auth.currentUser.getIdToken().then(function(idToken){
          return fetch(WORKER_URL + '/upload', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + idToken,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ filename: filename, contentType: 'image/webp', base64: base64 })
          }).then(function(res){
            return res.json().then(function(data){
              if(!res.ok) throw new Error(data.error || 'Gagal upload gambar');
              return data.url;
            });
          });
        });
      });
    });
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var statusEl = document.getElementById('loginStatus');
    statusEl.textContent = '';
    auth.signInWithEmailAndPassword(email, password).catch(function(err){
      statusEl.textContent = 'Login gagal: email atau password salah.';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    auth.signOut();
  });

  auth.onAuthStateChanged(function(user){
    if(user){
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      loadProducts();
      startOrdersListener();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminApp').style.display = 'none';
      if(unsubscribeOrders){ unsubscribeOrders(); unsubscribeOrders = null; }
    }
  });

  var unsubscribeOrders = null;

  function rupiah(n){ return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }

  function renderOrders(orders){
    var listEl = document.getElementById('orderList');
    if(orders.length === 0){
      listEl.innerHTML = '<div class="empty-msg">Belum ada pesanan online.</div>';
      return;
    }
    listEl.innerHTML = '';
    orders.forEach(function(o){
      var item = document.createElement('div');
      item.className = 'order-item';
      var itemsHtml = (o.items || []).map(function(it){
        return '<div>' + it.name + ' (' + it.variant + ') x' + it.qty + ' — ' + rupiah(it.price * it.qty) + '</div>';
      }).join('');
      var statusClass = 'badge-' + (o.status || 'baru');
      var fulfillText = o.fulfillment === 'delivery' ? ('Dikirim — ' + (o.address || '')) : 'Ambil di toko';
      item.innerHTML =
        '<div class="order-top">' +
          '<div><div class="order-code">' + (o.orderCode || o.id) + '</div>' +
            '<div class="order-cust">' + o.customerName + ' &middot; ' + o.customerPhone + '</div></div>' +
          '<span class="badge ' + statusClass + '">' + (o.status || 'baru') + '</span>' +
        '</div>' +
        '<div class="order-items">' + itemsHtml + '</div>' +
        '<div class="order-total">' + rupiah(o.total) + '</div>' +
        '<div class="order-meta">' + fulfillText + ' &middot; Bayar: ' + o.payment + (o.note ? (' &middot; Catatan: ' + o.note) : '') + '</div>' +
        '<div class="order-actions">' +
          '<select class="status-select">' +
            '<option value="baru"' + (o.status === 'baru' ? ' selected' : '') + '>Baru</option>' +
            '<option value="diproses"' + (o.status === 'diproses' ? ' selected' : '') + '>Diproses</option>' +
            '<option value="selesai"' + (o.status === 'selesai' ? ' selected' : '') + '>Selesai</option>' +
          '</select>' +
          '<button class="small-btn danger delete-order-btn">Hapus</button>' +
        '</div>';
      listEl.appendChild(item);
      item.querySelector('.status-select').addEventListener('change', function(e){
        db.collection('orders').doc(o.id).update({ status: e.target.value }).catch(function(err){
          alert('Gagal update status: ' + err.message);
        });
      });
      item.querySelector('.delete-order-btn').addEventListener('click', function(){
        if(confirm('Hapus pesanan ' + (o.orderCode || o.id) + '?')){
          db.collection('orders').doc(o.id).delete().catch(function(err){
            alert('Gagal hapus: ' + err.message);
          });
        }
      });
    });
  }

  function startOrdersListener(){
    if(unsubscribeOrders) return;
    unsubscribeOrders = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(function(snapshot){
      var orders = snapshot.docs.map(function(doc){
        var data = doc.data();
        data.id = doc.id;
        return data;
      });
      renderOrders(orders);
    }, function(err){
      console.error('Gagal ambil pesanan:', err);
      document.getElementById('orderList').innerHTML = '<div class="empty-msg">Gagal memuat pesanan: ' + err.message + '</div>';
    });
  }

  function loadProducts(){
    document.getElementById('productList').innerHTML = '<div class="empty-msg">Memuat produk...</div>';
    fetch(WORKER_URL + '/products').then(function(res){
      return res.json();
    }).then(function(products){
      renderList(products);
    }).catch(function(err){
      console.error('Gagal ambil produk:', err);
      document.getElementById('productList').innerHTML = '<div class="empty-msg">Gagal memuat produk: ' + err.message + '</div>';
    });
  }

  var editingId = null;

  document.querySelectorAll('.cat-check').forEach(function(cb){
    cb.addEventListener('change', function(){
      if(cb.checked){
        document.querySelectorAll('.cat-check').forEach(function(other){
          if(other !== cb) other.checked = false;
        });
      }
    });
  });

  document.querySelectorAll('.variant-check-row').forEach(function(row){
    var check = row.querySelector('.var-check');
    var priceInput = row.querySelector('.var-price');
    check.addEventListener('change', function(){
      priceInput.disabled = !check.checked;
      if(!check.checked) priceInput.value = '';
    });
  });

  document.getElementById('fImageFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var statusEl = document.getElementById('uploadStatus');
    document.getElementById('imagePreview').src = URL.createObjectURL(file);
    document.getElementById('imagePreviewWrap').style.display = 'block';
    statusEl.textContent = 'Mengompres ke WebP & mengunggah ke GitHub...';
    uploadImageToR2(file).then(function(url){
      document.getElementById('fImage').value = url;
      statusEl.textContent = 'Gambar berhasil diunggah.';
    }).catch(function(err){
      console.error(err);
      statusEl.textContent = 'Gagal unggah gambar: ' + err.message;
    });
  });

  function resetForm(){
    editingId = null;
    document.getElementById('productForm').reset();
    document.getElementById('fImage').value = '';
    document.getElementById('imagePreviewWrap').style.display = 'none';
    document.getElementById('uploadStatus').textContent = '';
    document.querySelectorAll('.cat-check').forEach(function(cb){ cb.checked = false; });
    document.querySelectorAll('.variant-check-row').forEach(function(row){
      row.querySelector('.var-check').checked = false;
      var priceInput = row.querySelector('.var-price');
      priceInput.value = '';
      priceInput.disabled = true;
    });
    document.getElementById('formTitle').textContent = 'Tambah Produk Baru';
    document.getElementById('submitBtn').textContent = 'Simpan Produk';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('formStatus').textContent = '';
    document.getElementById('formStatus').className = 'status';
  }

  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  function fillFormForEdit(p){
    editingId = p.id;
    document.getElementById('fName').value = p.name || '';
    document.querySelectorAll('.cat-check').forEach(function(cb){
      cb.checked = (cb.value === p.category);
    });
    document.getElementById('fImage').value = p.imageUrl || '';
    if(p.imageUrl){
      document.getElementById('imagePreview').src = p.imageUrl;
      document.getElementById('imagePreviewWrap').style.display = 'block';
    } else {
      document.getElementById('imagePreviewWrap').style.display = 'none';
    }
    document.getElementById('fDesc').value = p.description || '';
    document.querySelectorAll('.variant-check-row').forEach(function(row){
      var check = row.querySelector('.var-check');
      var priceInput = row.querySelector('.var-price');
      var match = (p.variants || []).find(function(v){ return v.label === check.value; });
      if(match){
        check.checked = true;
        priceInput.disabled = false;
        priceInput.value = match.price;
      } else {
        check.checked = false;
        priceInput.disabled = true;
        priceInput.value = '';
      }
    });
    document.getElementById('formTitle').textContent = 'Edit Produk';
    document.getElementById('submitBtn').textContent = 'Update Produk';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('productForm').addEventListener('submit', function(e){
    e.preventDefault();
    var statusEl = document.getElementById('formStatus');
    var name = document.getElementById('fName').value.trim();
    var category = '';
    var catChecked = document.querySelector('.cat-check:checked');
    if(catChecked) category = catChecked.value;

    var imageUrl = document.getElementById('fImage').value.trim();
    var desc = document.getElementById('fDesc').value.trim();

    var variants = [];
    document.querySelectorAll('.variant-check-row').forEach(function(row){
      var check = row.querySelector('.var-check');
      var priceInput = row.querySelector('.var-price');
      var price = parseInt(priceInput.value, 10);
      if(check.checked && !isNaN(price)) variants.push({ label: check.value, price: price });
    });

    if(!name || !category || variants.length === 0){
      statusEl.textContent = 'Isi nama, kategori, dan minimal 1 varian dengan harga.';
      statusEl.className = 'status err';
      return;
    }

    var data = {
      name: name,
      category: category,
      imageUrl: imageUrl,
      description: desc,
      variants: variants
    };

    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    statusEl.textContent = 'Menyimpan...';
    statusEl.className = 'status';

    auth.currentUser.getIdToken().then(function(idToken){
      var endpoint = editingId ? (WORKER_URL + '/products/' + editingId) : (WORKER_URL + '/products');
      var method = editingId ? 'PUT' : 'POST';
      return fetch(endpoint, {
        method: method,
        headers: { 'Authorization': 'Bearer ' + idToken, 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(function(res){
        return res.json().then(function(resData){
          if(!res.ok) throw new Error(resData.error || 'Gagal simpan produk');
          return resData;
        });
      });
    }).then(function(){
      statusEl.textContent = 'Tersimpan. Produk sudah update di shop.';
      statusEl.className = 'status ok';
      submitBtn.disabled = false;
      resetForm();
      loadProducts();
    }).catch(function(err){
      console.error(err);
      statusEl.textContent = 'Gagal simpan: ' + err.message;
      statusEl.className = 'status err';
      submitBtn.disabled = false;
    });
  });

  function renderList(products){
    var listEl = document.getElementById('productList');
    if(products.length === 0){
      listEl.innerHTML = '<div class="empty-msg">Belum ada produk. Tambahin lewat form di atas.</div>';
      return;
    }
    listEl.innerHTML = '';
    products.forEach(function(p){
      var item = document.createElement('div');
      item.className = 'list-item';
      var initials = (p.name || '').split(' ').slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();
      var variantsText = (p.variants || []).map(function(v){
        return v.label + ' (Rp' + Number(v.price).toLocaleString('id-ID') + ')';
      }).join(', ');
      item.innerHTML =
        '<div class="list-thumb">' + (p.imageUrl ? '<img src="' + p.imageUrl + '" alt="">' : initials) + '</div>' +
        '<div class="list-info">' +
          '<h3>' + p.name + '</h3>' +
          '<span class="cat mono">' + p.category + '</span>' +
          '<div class="variants">' + variantsText + '</div>' +
        '</div>' +
        '<div class="list-btns">' +
          '<button class="small-btn edit-btn">Edit</button>' +
          '<button class="small-btn danger delete-btn">Hapus</button>' +
        '</div>';
      listEl.appendChild(item);
      item.querySelector('.edit-btn').addEventListener('click', function(){ fillFormForEdit(p); });
      item.querySelector('.delete-btn').addEventListener('click', function(){
        if(confirm('Hapus produk "' + p.name + '"?')){
          auth.currentUser.getIdToken().then(function(idToken){
            return fetch(WORKER_URL + '/products/' + p.id, {
              method: 'DELETE',
              headers: { 'Authorization': 'Bearer ' + idToken }
            });
          }).then(function(res){
            if(!res.ok) throw new Error('Gagal hapus produk');
            loadProducts();
          }).catch(function(err){
            alert('Gagal hapus: ' + err.message);
          });
        }
      });
    });
  }

  resetForm();

  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      var tab = btn.dataset.tab;
      document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelector('.tab-panel[data-panel="' + tab + '"]').classList.add('active');
    });
  });
})();
</script>
</body>
</html>
